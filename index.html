<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="壮大なる愚作：ポエム集．すなわち，自身の表層について">
    <link rel="icon" href="icon.JPG">
    <title>壮大なる愚作</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Mono&family=Noto+Music&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/score.css">
</head>
<body>

    <div class="hero-full">
        <svg class="icon-full" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="ページ内ナビゲーション">
            <line x1="0" y1="960" x2="900" y2="120" stroke="var(--ink)" stroke-width="1" opacity="0.07"></line>
            <line x1="200" y1="1000" x2="1100" y2="40" stroke="var(--ink)" stroke-width="1" opacity="0.05"></line>
            <g class="hotspot" tabindex="0" data-target="#abstract" data-label="ABSTRACT">
                <title>ABSTRACT</title>
                <circle class="shape" cx="430" cy="300" r="280" fill="var(--k-blue)" fill-opacity="0.15" stroke="var(--ink)" stroke-width="1.6"></circle>
            </g>
            <g class="hotspot" tabindex="0" data-target="#identity" data-label="IDENTITY">
                <title>IDENTITY</title>
                <polygon class="shape" points="130,800 500,610 320,980" fill="var(--k-yellow)" stroke="var(--ink)" stroke-width="1.4"></polygon>
            </g>
            <g class="hotspot" tabindex="0" data-target="#score-frame" data-label="CONTENTS">
                <title>CONTENTS</title>
                <rect class="shape" x="1080" y="140" width="44" height="44" fill="var(--ink)"></rect>
                <rect class="shape" x="1080" y="228" width="44" height="44" fill="var(--ink)"></rect>
                <rect class="shape" x="1168" y="184" width="44" height="44" fill="var(--ink)"></rect>
                <rect class="shape" x="1168" y="272" width="44" height="44" fill="var(--ink)"></rect>
                <rect class="shape" x="1256" y="140" width="44" height="44" fill="var(--ink)"></rect>
                <rect class="shape" x="1256" y="228" width="44" height="44" fill="var(--ink)"></rect>
            </g>
            <g class="hotspot" tabindex="0" data-target="#contact" data-label="CONTACT">
                <title>CONTACT</title>
                <circle class="shape" cx="1500" cy="110" r="30" fill="var(--k-red)"></circle>
            </g>
            <g class="hotspot" tabindex="0" data-target="#help" data-label="HELP">
                <title>HELP</title>
                <line class="shape" x1="980" y1="880" x2="1400" y2="600" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"></line>
                <circle class="shape" cx="1400" cy="600" r="9" fill="var(--ink)"></circle>
            </g>
        </svg>
        <div class="hero-text">
            <p class="eyebrow">MSW-DSCH</p>
            <h1 class="title">壮大なる愚作</h1>
            <p class="deck">ポエム集．すなわち，自身の表層について</p>
            <p class="icon-caption" id="iconCaption">&nbsp;</p>
        </div>
        <div class="scroll-cue">
            <span>SCROLL</span>
            <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 5 L7 10 L12 5" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg>
        </div>
    </div>

    <div class="page">

        <div class="score-frame" id="score-frame">
            <span class="corner-bl"></span><span class="corner-br"></span>
            <div id="score-canvas-mount"></div>
        </div>

    </div>

    <footer class="site-footer">
        <p>© 2024 壮大なる愚作 MSW-DSCH</p>
    </footer>

    <!-- Abstract/Identity/Contact/Help の本文．常設ページには表示されず，
         対応するアイコンのクリックでモーダルに複製されて表示される．
         他ページはこのページを fetch してここから内容を読み取る（assets/score.js）． -->
    <template id="tpl-abstract">
        <p class="eyebrow">ABSTRACT</p>
        <h2>Abstract</h2>
        <p class="note">本文は未着手です．</p>
    </template>
    <template id="tpl-identity">
        <p class="eyebrow">IDENTITY</p>
        <h2>Identity</h2>
        <p>建築学を専攻し，主に災害リスクに関する研究を行っている．並行して，ロシア・アヴァンギャルド周辺のクラシック音楽の紹介と，自作曲の作曲を続けている．</p>
        <a class="cta-link" href="./introduction/index.html">略歴ページを見る →</a>
    </template>
    <template id="tpl-contact">
        <p class="eyebrow">CONTACT</p>
        <h2>Contact</h2>
        <p><span class="fake-link">msw.dsch@gmail.com</span></p>
    </template>
    <template id="tpl-help">
        <p class="eyebrow">HELP</p>
        <h2>Help</h2>
        <p>このサイトの各記事は，上のスコア譜に「和音」として並びます．五線はソプラノ・アルト・テノール・バスの4段で，それぞれ記事ベクトルの第1〜第4主成分（現状は仮値）をそのまま音高として表示します．1つの記事が同時に4つの音として鳴ります．</p>
        <p>横位置は投稿日（左が古く，右が新しい）．投稿が密な時期は音符が密集し，間が空いた時期は自然に離散します．音符の形（三角形・円・ひし形）と色は段ごとに固定の意匠で，カンディンスキーの色彩理論（三角形＝黄，円＝青，四角＝赤）から借りています．</p>
        <p>符幹をつなぐ太い線（連桁）は，同一連作（続き物）の記事どうしに，4段すべてで並行して引かれます．音符をクリックすると，その記事のページへ移動します．記事のページでは，その記事を中心とした近傍を，第1主成分だけを使った1段の「パート譜」で表示します．</p>
        <p>破線の輪郭で描かれる音符は，実際の記事ではなく，仕組みを示すためのデモ記事です．</p>
        <p>冒頭の図形（円・三角形・格子・点・線）はそれぞれ Abstract／Identity／Contents／Contact／Help に対応します．クリックするとその内容がウィンドウとして浮かび上がります．</p>
    </template>

    <div class="modal-overlay" id="modalOverlay" hidden>
        <div class="modal-panel" role="dialog" aria-modal="true">
            <button class="modal-close" type="button" id="modalClose" aria-label="閉じる">×</button>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="assets/score-data.js"></script>
    <script src="assets/score.js"></script>
</body>
</html>
